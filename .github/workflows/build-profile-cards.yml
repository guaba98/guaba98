name: Build Profile Cards (Static)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"  # 매일 00:00 UTC (한국시간 09:00)

permissions:
  contents: write

jobs:
  build-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create assets folder
        run: mkdir -p assets

      - name: Fetch GitHub Stats (SVG)
        run: |
          curl -L --fail \
            "https://github-readme-stats.vercel.app/api?username=guaba98&show_icons=true&include_all_commits=true&count_private=true&hide_border=true" \
            -o assets/github-stats.svg

      - name: Fetch Top Languages (SVG)
        run: |
          curl -L --fail \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=guaba98&layout=compact&hide_border=true" \
            -o assets/top-langs.svg

      - name: Commit & Push (if changed)
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore: update profile cards"
          git push
